<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 614" role="img">
<title>Code level: how the Stage 1 probe measures the noise growth</title>
<desc>For each t the probe runs many trials in two regimes, independent and identical, decrypts to extract the summed error, verifies the exact identity that e_sum equals the sum of the input errors, measures the root mean square of the error in the ring domain and the imaginary slot domain, and fits the growth exponent.</desc>
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px}
  .bn{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
  .ba{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
  .bw{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
  .bok{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.5}
  .tn{fill:#2C2C2A}.ta{fill:#04342C}.tw{fill:#4A1B0C}.tok{fill:#173404}
  .arr{stroke:#888780;fill:none;stroke-width:1.5;stroke-linecap:round}
  @media (prefers-color-scheme:dark){
    .bn{fill:#2C2C2A;stroke:#888780}.ba{fill:#04342C;stroke:#1D9E75}.bw{fill:#4A1B0C;stroke:#D85A30}.bok{fill:#173404;stroke:#639922}
    .tn{fill:#F1EFE8}.ta{fill:#9FE1CB}.tw{fill:#F5C4B3}.tok{fill:#C0DD97}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="bn" x="240" y="30" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="48" text-anchor="middle" dominant-baseline="central">for each t</text>
<text class="ts tn" x="340" y="66" text-anchor="middle" dominant-baseline="central">t = 1, 2, 4, …, 256</text>

<line class="arr" x1="340" y1="86" x2="192" y2="122" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="86" x2="488" y2="122" marker-end="url(#arrow)"/>

<rect class="ba" x="90" y="126" width="200" height="56" rx="8"/>
<text class="th ta" x="190" y="144" text-anchor="middle" dominant-baseline="central">independent</text>
<text class="ts ta" x="190" y="162" text-anchor="middle" dominant-baseline="central">t fresh → sum</text>

<rect class="bw" x="390" y="126" width="200" height="56" rx="8"/>
<text class="th tw" x="490" y="144" text-anchor="middle" dominant-baseline="central">identical</text>
<text class="ts tw" x="490" y="162" text-anchor="middle" dominant-baseline="central">one → add t×</text>

<line class="arr" x1="190" y1="182" x2="288" y2="220" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="182" x2="392" y2="220" marker-end="url(#arrow)"/>

<rect class="bn" x="240" y="222" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="240" text-anchor="middle" dominant-baseline="central">decrypt → e_sum</text>
<text class="ts tn" x="340" y="258" text-anchor="middle" dominant-baseline="central">msg 0, so d = e_sum</text>

<line class="arr" x1="340" y1="278" x2="340" y2="314" marker-end="url(#arrow)"/>

<rect class="bok" x="240" y="318" width="200" height="56" rx="8"/>
<text class="th tok" x="340" y="336" text-anchor="middle" dominant-baseline="central">verify identity</text>
<text class="ts tok" x="340" y="354" text-anchor="middle" dominant-baseline="central">e_sum = Σ e (exact)</text>

<line class="arr" x1="340" y1="374" x2="340" y2="410" marker-end="url(#arrow)"/>

<rect class="bn" x="240" y="414" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="432" text-anchor="middle" dominant-baseline="central">measure RMS</text>
<text class="ts tn" x="340" y="450" text-anchor="middle" dominant-baseline="central">ring &amp; slot, pooled</text>

<line class="arr" x1="340" y1="470" x2="340" y2="506" marker-end="url(#arrow)"/>

<rect class="bn" x="240" y="510" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="528" text-anchor="middle" dominant-baseline="central">fit exponent</text>
<text class="ts tn" x="340" y="546" text-anchor="middle" dominant-baseline="central">slope: log RMS vs log t</text>

<rect class="ba" x="200" y="586" width="14" height="14" rx="3"/>
<text class="ts tn" x="222" y="593" text-anchor="start" dominant-baseline="central">independent regime</text>
<rect class="bw" x="430" y="586" width="14" height="14" rx="3"/>
<text class="ts tn" x="452" y="593" text-anchor="start" dominant-baseline="central">identical regime</text>
</svg>
