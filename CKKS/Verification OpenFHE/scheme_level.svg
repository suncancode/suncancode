<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 610" role="img">
<title>Scheme level: independent inputs grow as sigma root t, identical inputs grow as sigma t</title>
<desc>Homomorphic addition sums the errors exactly. Independent errors add in variance giving standard deviation sigma times root t (the average case a library assumes). Identical errors align and give standard deviation sigma times t (the worst case an adversary forces). The gap is a factor root t.</desc>
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px}
  .bn{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
  .ba{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
  .bw{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
  .tn{fill:#2C2C2A}.ta{fill:#04342C}.tw{fill:#4A1B0C}
  .arr{stroke:#888780;fill:none;stroke-width:1.5;stroke-linecap:round}
  @media (prefers-color-scheme:dark){
    .bn{fill:#2C2C2A;stroke:#888780}.ba{fill:#04342C;stroke:#1D9E75}.bw{fill:#4A1B0C;stroke:#D85A30}
    .tn{fill:#F1EFE8}.ta{fill:#9FE1CB}.tw{fill:#F5C4B3}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="bn" x="240" y="30" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="48" text-anchor="middle" dominant-baseline="central">t ciphertexts</text>
<text class="ts tn" x="340" y="66" text-anchor="middle" dominant-baseline="central">each carries error e</text>

<line class="arr" x1="340" y1="86" x2="340" y2="122" marker-end="url(#arrow)"/>

<rect class="bn" x="250" y="126" width="180" height="44" rx="8"/>
<text class="th tn" x="340" y="148" text-anchor="middle" dominant-baseline="central">homomorphic add</text>

<line class="arr" x1="340" y1="170" x2="340" y2="206" marker-end="url(#arrow)"/>

<rect class="bn" x="240" y="210" width="200" height="56" rx="8"/>
<text class="th tn" x="340" y="228" text-anchor="middle" dominant-baseline="central">error of the sum</text>
<text class="ts tn" x="340" y="246" text-anchor="middle" dominant-baseline="central">= sum of all errors</text>

<line class="arr" x1="340" y1="266" x2="192" y2="302" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="266" x2="488" y2="302" marker-end="url(#arrow)"/>

<rect class="ba" x="90" y="306" width="200" height="56" rx="8"/>
<text class="th ta" x="190" y="324" text-anchor="middle" dominant-baseline="central">independent inputs</text>
<text class="ts ta" x="190" y="342" text-anchor="middle" dominant-baseline="central">fresh, uncorrelated</text>

<rect class="bw" x="390" y="306" width="200" height="56" rx="8"/>
<text class="th tw" x="490" y="324" text-anchor="middle" dominant-baseline="central">identical inputs</text>
<text class="ts tw" x="490" y="342" text-anchor="middle" dominant-baseline="central">adversary reuses one</text>

<line class="arr" x1="190" y1="362" x2="190" y2="398" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="362" x2="490" y2="398" marker-end="url(#arrow)"/>

<rect class="ba" x="90" y="402" width="200" height="56" rx="8"/>
<text class="th ta" x="190" y="420" text-anchor="middle" dominant-baseline="central">std = σ·√t</text>
<text class="ts ta" x="190" y="438" text-anchor="middle" dominant-baseline="central">variance adds — avg case</text>

<rect class="bw" x="390" y="402" width="200" height="56" rx="8"/>
<text class="th tw" x="490" y="420" text-anchor="middle" dominant-baseline="central">std = σ·t</text>
<text class="ts tw" x="490" y="438" text-anchor="middle" dominant-baseline="central">errors align — worst case</text>

<line class="arr" x1="190" y1="458" x2="268" y2="496" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="458" x2="412" y2="496" marker-end="url(#arrow)"/>

<rect class="bw" x="190" y="498" width="300" height="56" rx="8"/>
<text class="th tw" x="340" y="516" text-anchor="middle" dominant-baseline="central">gap = √t</text>
<text class="ts tw" x="340" y="534" text-anchor="middle" dominant-baseline="central">flooding to σ√t misses σt</text>

<rect class="ba" x="200" y="574" width="14" height="14" rx="3"/>
<text class="ts tn" x="222" y="581" text-anchor="start" dominant-baseline="central">average case (assumed)</text>
<rect class="bw" x="430" y="574" width="14" height="14" rx="3"/>
<text class="ts tn" x="452" y="581" text-anchor="start" dominant-baseline="central">worst case (adversary)</text>
</svg>
